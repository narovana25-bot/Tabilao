name: Build Tabilao Anjara EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build EXE
        run: npm run build

      - name: Show files
        if: always()
        run: |
          Write-Host "=== ROOT ==="
          Get-ChildItem
          Write-Host "=== DIST ==="
          if (Test-Path dist) { Get-ChildItem dist }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Tabilao-Anjara-Windows
          path: dist/*.exe
          if-no-files-found: error
