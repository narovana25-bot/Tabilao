name: Build Tabilao Anjara EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./tabilao-exe
        run: npm install

      - name: Build EXE
        working-directory: ./tabilao-exe
        run: npm run build

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Tabilao-Anjara-Windows
          path: tabilao-exe/dist/*.exe
          if-no-files-found: error
